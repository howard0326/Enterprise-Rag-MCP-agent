<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>企业级 RAG + MCP 智能助手 · 演示控制台</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --text:#e6e9ef; --dim:#8b93a7; --accent:#4f8cff; --ok:#3fb950;
    --warn:#d29922; --err:#f85149; --user:#1f6feb; --bot:#22272e;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.6}
  header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;
         align-items:center;gap:14px;flex-wrap:wrap;background:var(--panel)}
  header h1{font-size:16px;margin:0;font-weight:600}
  .badge{padding:2px 9px;border-radius:11px;font-size:12px;border:1px solid var(--line);color:var(--dim)}
  .badge.ok{color:var(--ok);border-color:#1d3f24}
  .badge.err{color:var(--err);border-color:#4a1f1f}
  .wrap{display:grid;grid-template-columns:1fr 380px;gap:16px;padding:16px;height:calc(100vh - 58px)}
  @media(max-width:1000px){.wrap{grid-template-columns:1fr;height:auto}}
  .col{display:flex;flex-direction:column;gap:16px;min-height:0}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;
        display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .card h2{font-size:13px;margin:0;padding:11px 14px;border-bottom:1px solid var(--line);
           font-weight:600;color:var(--dim);letter-spacing:.4px;text-transform:uppercase}
  .card .body{padding:14px;overflow:auto;flex:1;min-height:0}
  .chat{display:flex;flex-direction:column;height:100%}
  #msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
  .msg{max-width:88%;padding:10px 13px;border-radius:10px;white-space:pre-wrap;word-break:break-word}
  .msg.user{align-self:flex-end;background:var(--user);color:#fff}
  .msg.bot{align-self:flex-start;background:var(--bot);border:1px solid var(--line)}
  .msg.bot code{background:#0d1117;padding:1px 5px;border-radius:4px;font-size:12px}
  .meta{font-size:12px;color:var(--dim);margin-top:7px;padding-top:7px;border-top:1px dashed var(--line)}
  .meta b{color:var(--text);font-weight:600}
  .tag{display:inline-block;background:#243044;color:#9dc0ff;padding:1px 7px;border-radius:4px;
       margin:2px 4px 2px 0;font-size:11px;font-family:ui-monospace,Consolas,monospace}
  .tag.ok{background:#16301c;color:#7ee787}
  .tag.err{background:#3a1a1a;color:#ff9d92}
  .steps{font-size:12px;margin:6px 0 0}
  .steps div{padding:3px 0;color:var(--dim)}
  .steps .t{color:var(--accent)}
  #inputbar{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);background:var(--panel2)}
  textarea{flex:1;background:#0d1117;border:1px solid var(--line);color:var(--text);
           border-radius:8px;padding:9px 11px;resize:none;font-family:inherit;font-size:14px}
  textarea:focus{outline:none;border-color:var(--accent)}
  button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:0 16px;
         font-size:14px;cursor:pointer;font-weight:500}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--dim);padding:5px 11px;font-size:12px}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:13px}
  .kv .k{color:var(--dim)}
  .kv .v{font-family:ui-monospace,Consolas,monospace;word-break:break-all}
  .bar{height:7px;background:#0d1117;border-radius:4px;overflow:hidden;margin-top:5px}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,#4f8cff,#7ee787)}
  .hit{border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-bottom:9px;background:var(--panel2)}
  .hit .top{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-bottom:5px}
  .hit .txt{font-size:12.5px;color:#c9d1d9;max-height:88px;overflow:auto}
  .hint{color:var(--dim);font-size:12px;text-align:center;padding:20px}
  .quick{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 11px}
  .quick button{background:#22272e;border:1px solid var(--line);color:#c9d1d9;
                font-size:12px;padding:5px 10px;font-weight:400}
</style>
</head>
<body>
<header>
  <h1>企业级 RAG + MCP 智能助手</h1>
  <span class="badge" id="b-health">健康检查…</span>
  <span class="badge" id="b-llm">LLM…</span>
  <span class="badge" id="b-kb">知识库…</span>
  <button class="ghost" onclick="refresh()">刷新</button>
</header>

<div class="wrap">
  <!-- 左：对话 -->
  <div class="card chat">
    <h2>对话演示</h2>
    <div id="msgs">
      <div class="hint">在下面输入问题，或点快捷问题进行演示</div>
    </div>
    <div class="quick">
      <button onclick="ask('退货政策是什么？')">① 纯知识问答</button>
      <button onclick="ask('查一下 CUST-1001 的所有订单。')">② 纯数据查询</button>
      <button onclick="ask('订单 ORD-001 符合退货政策吗？')">③ 混合问题（核心）</button>
      <button onclick="ask('帮我给订单 ORD-001 创建一个高优先级工单，退款一直没到账。')">④ 操作请求</button>
      <button onclick="ask('我那个订单能退吗？')">⑤ 信息不足</button>
      <button onclick="ask('那它的状态是什么？')">⑥ 多轮追问</button>
    </div>
    <div id="inputbar">
      <textarea id="q" rows="1" placeholder="输入问题…（Enter 发送，Shift+Enter 换行）"
                onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();ask()}"></textarea>
      <button id="send" onclick="ask()">发送</button>
      <button class="ghost" onclick="clearChat()">清空</button>
    </div>
  </div>

  <!-- 右：状态 + 检索器 -->
  <div class="col">
    <div class="card">
      <h2>系统状态</h2>
      <div class="body" id="status"><div class="hint">加载中…</div></div>
    </div>
    <div class="card" style="flex:1">
      <h2>知识库检索器（直连 Qdrant）</h2>
      <div class="body">
        <div style="display:flex;gap:8px;margin-bottom:11px">
          <textarea id="rq" rows="1" placeholder="输入检索词，如：退货期限"
                    onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();doSearch()}"></textarea>
          <button onclick="doSearch()">检索</button>
        </div>
        <div id="hits"><div class="hint">检索结果会显示在这里（含分数与来源）</div></div>
      </div>
    </div>
  </div>
</div>

<script>
const API = 'http://127.0.0.1:8000';
let sessionId = 'web-' + Math.random().toString(36).slice(2, 10);

const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fmt = s => esc(s)
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
  .replace(/`([^`]+)`/g, '<code>$1</code>');

/* ---------- 状态面板 ---------- */
async function refresh() {
  try {
    const h = await (await fetch(API + '/health')).json();
    setBadge('b-health', 'status: ' + h.status, h.status === 'ok');
    setBadge('b-llm', 'LLM: ' + h.llm.model + ' · ' + h.llm.intent_source,
             h.llm.configured);
    const kb = (h.servers || []).find(s => s.server === 'knowledge_base') || {};
    setBadge('b-kb', 'MCP: ' + (h.servers || []).map(s => s.server).join(' + '),
             (h.servers || []).every(s => s.ok));

    let rows = '';
    (h.servers || []).forEach(s => {
      rows += `<div class="k">${s.server}</div><div class="v">
        <span class="tag ${s.ok ? 'ok' : 'err'}">${s.ok ? 'OK' : 'FAIL'}</span>
        ${(s.tools || []).join(', ')} · ${s.latency_ms}ms</div>`;
    });
    rows += `<div class="k">意图识别</div><div class="v">${h.llm.intent_source === 'llm'
      ? 'LLM 分类（主路径）' : '规则兜底'}</div>`;
    rows += `<div class="k">会话数</div><div class="v">${h.sessions}</div>`;

    // 知识库规模
    try {
      const c = await (await fetch('http://127.0.0.1:6333/collections/enterprise_docs')).json();
      const m = await (await fetch('http://127.0.0.1:6333/collections/enterprise_docs_meta')).json();
      rows += `<div class="k">片段数</div><div class="v">${c.result.points_count}</div>`;
      rows += `<div class="k">文档数</div><div class="v">${m.result.points_count}</div>`;
      rows += `<div class="k">向量维度</div><div class="v">${
        c.result.config.params.vectors.dense.size} · ${c.result.config.params.vectors.dense.distance}</div>`;
      rows += `<div class="k">稀疏向量</div><div class="v">${
        Object.keys(c.result.config.params.sparse_vectors || {}).join(',') || '—'}
        （IDF 修饰符）</div>`;
    } catch (e) {
      rows += `<div class="k">Qdrant</div><div class="v" style="color:var(--err)">直连失败：${e.message}</div>`;
    }
    document.getElementById('status').innerHTML = `<div class="kv">${rows}</div>`;
  } catch (e) {
    setBadge('b-health', '后端不可达', false);
    document.getElementById('status').innerHTML =
      `<div class="hint" style="color:var(--err)">后端未启动或端口不通<br>
       请执行 scripts\\start_demo.ps1</div>`;
  }
}
function setBadge(id, text, ok) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = 'badge ' + (ok ? 'ok' : 'err');
}

/* ---------- 对话 ---------- */
function addMsg(role, html) {
  const box = document.getElementById('msgs');
  if (box.querySelector('.hint')) box.innerHTML = '';
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  d.innerHTML = html;
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
  return d;
}

async function ask(preset) {
  const ta = document.getElementById('q');
  const msg = preset || ta.value.trim();
  if (!msg) return;
  ta.value = '';
  document.getElementById('send').disabled = true;
  addMsg('user', esc(msg));
  const pending = addMsg('bot', '<span style="color:var(--dim)">思考中…</span>');

  try {
    const r = await fetch(API + '/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg, session_id: sessionId })
    });
    const d = await r.json();

    let meta = '';
    if (d.plan && d.plan.length) {
      meta += '<div class="steps">';
      d.plan.forEach(s => {
        meta += `<div><span class="t">${s.action}</span> → ${s.tool || '—'}
                 <span style="opacity:.7">${esc(s.reason || '')}</span></div>`;
      });
      meta += '</div>';
    }
    if (d.tool_calls && d.tool_calls.length) {
      meta += d.tool_calls.map(t =>
        `<span class="tag ${t.ok ? 'ok' : 'err'}">${t.tool} ${t.ok ? '✓' : '✗'}
         ${Math.round(t.latency_ms)}ms</span>`).join('');
    }
    if (d.sources && d.sources.length) {
      meta += '<div style="margin-top:5px">来源：' + d.sources.map(s =>
        `《${esc(s.source)}》${s.page ? ' 第' + s.page + '页' : ''} 相关度 ${s.score}`
      ).join('；') + '</div>';
    }
    meta += `<div style="margin-top:5px">
      意图 <span class="tag">${(d.intents || []).join(', ')}</span>
      路径 <span class="tag">${d.intent_source}</span>
      ${d.degraded ? '<span class="tag err">已降级</span>' : ''}
      耗时 ${(d.metrics.total_latency_ms / 1000).toFixed(2)}s
      token ${d.metrics.prompt_tokens}+${d.metrics.completion_tokens}
    </div>`;

    pending.innerHTML = fmt(d.response) + '<div class="meta">' + meta + '</div>';
  } catch (e) {
    pending.innerHTML = `<span style="color:var(--err)">请求失败：${esc(e.message)}</span>`;
  } finally {
    document.getElementById('send').disabled = false;
    document.getElementById('msgs').scrollTop = 99999;
  }
}

function clearChat() {
  sessionId = 'web-' + Math.random().toString(36).slice(2, 10);
  document.getElementById('msgs').innerHTML =
    '<div class="hint">已开启新会话（session_id 已重置）</div>';
}

/* ---------- 直连 Qdrant 检索（看分数归因） ---------- */
async function doSearch() {
  const q = document.getElementById('rq').value.trim() || '退货期限';
  document.getElementById('rq').value = q;
  const box = document.getElementById('hits');
  box.innerHTML = '<div class="hint">检索中…</div>';
  try {
    const r = await fetch(API + '/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: q, session_id: 'retrieve-probe' })
    });
    const d = await r.json();
    const sources = d.sources || [];
    if (!sources.length) {
      box.innerHTML = '<div class="hint">无命中（该问题可能未触发知识库检索）</div>';
      return;
    }
    box.innerHTML = sources.map(s => `
      <div class="hit">
        <div class="top"><span>《${esc(s.source)}》${s.page ? ' 第' + s.page + '页' : ''}</span>
          <span>相关度 ${s.score}</span></div>
        <div class="bar"><i style="width:${Math.max(3, s.score * 100)}%"></i></div>
        <div class="txt">${esc(s.snippet || '')}</div>
        <div style="font-size:11px;color:var(--dim);margin-top:5px">
          doc_id ${s.doc_id} ${s.heading ? '· ' + esc(s.heading) : ''}</div>
      </div>`).join('');
  } catch (e) {
    box.innerHTML = `<div class="hint" style="color:var(--err)">检索失败：${esc(e.message)}</div>`;
  }
}

refresh();
setInterval(refresh, 15000);
</script>
</body>
</html>
